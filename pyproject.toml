[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "landsat-record"
version = "0.1.1"
description = "Crop the complete Landsat record to an Antarctic site and publish a viewer to browse it"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jonathan Kingslake" }]
dependencies = [
    "boto3",
    "gcsfs>=2023.1",
    "google-auth>=2",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=9.5",
    "pyarrow>=10",
    "pyproj>=3.4",
    "pystac-client>=0.7",
    "rasterio>=1.3",
    "requests",
    "s3fs>=2023.1",
    "shapely>=2",
    "tqdm>=4.60",
    "urllib3>=1.26",
]

[project.optional-dependencies]
plots = ["matplotlib"]
test = ["pytest", "matplotlib"]

[project.scripts]
landsat-record = "landsat_record.cli:main"

[project.urls]
Repository = "https://github.com/ldeo-glaciology/landsat-record"

[tool.setuptools.package-data]
landsat_record = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
